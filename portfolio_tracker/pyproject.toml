[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-tracker"
version = "1.0.0"
description = "Kişisel BIST ve TEFAS portföy takip uygulaması"
readme = { text = "Yerel SQLite veritabanıyla çalışan PySide6 portföy takip ve analiz uygulaması.", content-type = "text/markdown" }
requires-python = ">=3.11"
authors = [
    { name = "Talat Karasakal" },
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "PySide6>=6.5.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.11.1",
    "pyqtgraph>=0.13.3",
    "qtawesome>=1.2.3",
    "httpx>=0.24.1",
    "tefas-crawler>=0.2.1",
    "yfinance>=0.2.28",
    "openpyxl>=3.1.2",
    "pandas>=2.0.3",
    "numpy>=1.24.0",
    "plyer>=2.1.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.1",
    "mypy>=1.10.0",
    "pyinstaller>=6.8.0",
    "pytest>=8.2.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.5.0",
]

[project.scripts]
portfolio-tracker = "main:main"

[tool.setuptools]
include-package-data = true
py-modules = ["main", "mac_identity"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.setuptools.package-data]
app = [
    "database/migrations/*.py",
    "database/migrations/*.mako",
    "database/migrations/versions/*.py",
    "resources/*.png",
    "resources/*.icns",
    "resources/*.ico",
    "resources/fonts/*.ttf",
    "resources/styles/*.qss",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E701", "E402", "E712", "E501", "E722", "W291", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["app/database/migrations/"]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "dict-item",
    "method-assign",
    "return-value",
    "var-annotated",
]
