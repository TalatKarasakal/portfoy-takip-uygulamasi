[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-tracker"
version = "1.0.0"
description = "Kişisel BIST hisse senedi ve TEFAS fonu portföy takip uygulaması"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Talat Karasakal" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "PySide6>=6.5.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.11.1",
    "pyqtgraph>=0.13.3",
    "qtawesome>=1.2.3",
    "httpx>=0.24.1",
    "tefas-crawler>=0.2.1",
    "yfinance>=0.2.28",
    "requests>=2.31.0",
    "openpyxl>=3.1.2",
    "pandas>=2.0.3",
    "numpy>=1.24.0",
    "plyer>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "pyinstaller>=5.13.0",
    "mypy>=1.5.0",
]

[project.scripts]
portfolio-tracker = "main:main"

[tool.setuptools]
packages = ["app"]
py-modules = ["main"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E701", "E402", "E712", "E501", "E722", "W291", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disable_error_code = ["attr-defined", "return-value", "var-annotated", "assignment", "arg-type", "method-assign", "dict-item"]
