name: CI Setup

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - uses: actions/checkout@v4

    # PySide6/Qt, ubuntu-latest runner'da varsayılan kurulu OLMAYAN sistem
    # kütüphanelerine ihtiyaç duyar. Bunlar olmadan "import PySide6" hata verir
    # (libEGL.so.1 / Qt platform plugin yüklenemez) ve testler collection'da çöker.
    - name: Qt için sistem kütüphaneleri
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
          libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'portfolio_tracker/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r portfolio_tracker/requirements.txt
        pip install pytest pytest-qt ruff mypy

    - name: Run Ruff Check
      run: ruff check portfolio_tracker/

    - name: Run Mypy
      run: |
        cd portfolio_tracker
        mypy app

    - name: Run Pytest
      run: |
        cd portfolio_tracker
        python -m pytest
