name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PORTFOLIO_TRACKER_DATA_DIR: ${{ runner.temp }}/portfolio-test-data
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portfolio_tracker/pyproject.toml

      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./portfolio_tracker[dev]"

      - name: Ruff
        working-directory: portfolio_tracker
        run: ruff check app tests main.py mac_identity.py smoke_test.py

      - name: MyPy
        working-directory: portfolio_tracker
        run: mypy app main.py mac_identity.py

      - name: Tests
        working-directory: portfolio_tracker
        run: pytest -W error

      - name: GUI smoke
        working-directory: portfolio_tracker
        run: python smoke_test.py

      - name: Build wheel
        run: python -m build --wheel portfolio_tracker

      - name: Wheel entrypoint smoke
        run: |
          python -m pip install --force-reinstall --no-deps portfolio_tracker/dist/*.whl
          portfolio-tracker --smoke-test

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: portfolio_tracker/dist/PortfolioTracker/PortfolioTracker
          - os: macos-latest
            executable: portfolio_tracker/dist/PortfolioTracker.app/Contents/MacOS/PortfolioTracker
          - os: windows-latest
            executable: portfolio_tracker/dist/PortfolioTracker/PortfolioTracker.exe
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PORTFOLIO_TRACKER_DATA_DIR: ${{ runner.temp }}/portfolio-package-data
      PACKAGED_EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portfolio_tracker/pyproject.toml

      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./portfolio_tracker[dev]"

      - name: Build package
        run: >-
          pyinstaller --noconfirm --clean
          --distpath portfolio_tracker/dist
          --workpath portfolio_tracker/build
          portfolio_tracker/portfolio_tracker.spec

      - name: Packaged entrypoint smoke
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          executable = Path(os.environ["PACKAGED_EXECUTABLE"])
          if not executable.is_file():
              raise SystemExit(f"Paket giriş noktası bulunamadı: {executable}")
          subprocess.run([str(executable), "--smoke-test"], check=True)

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          bash portfolio_tracker/packaging/macos/build_dmg.sh
          portfolio_tracker/dist
          portfolio_tracker/release
          1.0.0

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ./portfolio_tracker/packaging/windows/build_installer.ps1
          -SourceDir dist/PortfolioTracker
          -OutputDir release
          -Version 1.0.0

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioTracker-macOS-${{ runner.arch }}
          path: |
            portfolio_tracker/release/*.dmg
            portfolio_tracker/release/*.sha256
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioTracker-Windows-x64
          path: |
            portfolio_tracker/release/*.exe
            portfolio_tracker/release/*.sha256
          if-no-files-found: error
